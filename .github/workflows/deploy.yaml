name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress run so a
# publish always finishes cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # One step, so a check added to `lint` runs in CI without editing this
      # file. The link check is not part of `lint`: it reads dist/ and so
      # belongs to the build, which runs it.
      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm exec astro check

      - name: Build Astro
        run: pnpm run build

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
